<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Un petit mot</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fdfcf9,#f6f2ea);
    font-family:Georgia, serif;
    padding:20px;
}

.card{
    width:100%;
    max-width:700px;
    background:white;
    padding:50px 35px;
    border-radius:24px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
}

textarea{
    width:100%;
    height:160px;
    padding:15px;
    border-radius:12px;
    border:1px solid #ddd;
}

button{
    margin-top:20px;
    border:none;
    padding:16px 34px;
    border-radius:999px;
    background:#1f2937;
    color:white;
    cursor:pointer;
}

</style>

<script>

function continuer(){

    localStorage.setItem(
        "message",
        document.getElementById("msg").value
    );

    window.location.href =
        "confirmation.html";
}

</script>

</head>

<body>

<div class="card">

<h2>
Un petit mot à me laisser ?
</h2>

<p>
Facultatif, mais vivement recommandé 😉
</p>

<p>
"Ça a intérêt à être bien."
<br><br>
"J'espère que la compagnie sera agréable."
<br><br>
"J'accepte, mais je garde un droit de regard sur le dessert."
</p>

<textarea id="msg"></textarea>

<br>

<button onclick="continuer()">
Valider
</button>

</div>

</body>
</html>
