<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Une petite question...</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8f6f2;
    font-family:Georgia, serif;
    padding:20px;
}

.card{
    background:white;
    width:100%;
    max-width:650px;
    padding:40px 30px;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
}

h2{
    font-weight:normal;
    line-height:1.5;
    margin-bottom:30px;
}

.arena{
    position:relative;
    height:320px;
    width:100%;
    overflow:hidden;
}

#yesBtn{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#1f2937;
    color:white;
    border:none;
    border-radius:30px;
    padding:15px 30px;
    cursor:pointer;
    font-size:16px;
    z-index:10;
}

#escapeContainer{
    position:absolute;
    left:50%;
    top:40px;
    transform:translateX(-50%);
    text-align:center;
}

#noBtn{
    background:#d1d5db;
    border:none;
    border-radius:30px;
    padding:15px 30px;
    cursor:pointer;
    font-size:16px;
}

#message{
    min-height:24px;
    margin-top:8px;
    color:#666;
    font-style:italic;
    font-size:14px;
}

.tip{
    margin-top:20px;
    color:#666;
    font-style:italic;
}

@media(max-width:600px){

    .card{
        padding:30px 20px;
    }

    .arena{
        height:360px;
    }

}
</style>
</head>

<body>

<div class="card">

<h2>
Et si on passait une soirée ensemble la semaine prochaine ?
</h2>

<div class="arena">

    <div id="escapeContainer">

        <button id="noBtn">
            Non merci
        </button>

        <div id="message"></div>

    </div>

    <button id="yesBtn">
        Je me laisse tenter
    </button>

</div>

<div class="tip">
Par curiosité, essaie de cliquer sur "Non merci"...
</div>

</div>

<script>

const phrases = [
"Bien essaye.",
"Rate.",
"Toujours pas.",
"Je vois que tu es perseverante.",
"Cette option semble indisponible.",
"Essaie encore.",
"Tu chauffes... ou pas.",
"Je preferais l'autre bouton.",
"Tu croyais vraiment que c'etait une option ?",
"Decidement...",
"Quel acharnement.",
"Je t'assure que l'autre bouton fonctionne tres bien.",
"Presque !",
"Non, non et toujours non.",
"C'est pourtant ecrit Non merci...",
"Je commence a admirer ta determination."
];

let tentatives = 0;

const arena = document.querySelector(".arena");
const escapeContainer = document.getElementById("escapeContainer");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");

function moveButton(){

    tentatives++;

    const largeur = arena.clientWidth - 220;
    const hauteur = arena.clientHeight - 140;

    const x = Math.max(10, Math.random() * largeur);
    const y = Math.max(10, Math.random() * hauteur);

    escapeContainer.style.left = x + "px";
    escapeContainer.style.top = y + "px";

    let phrase =
        phrases[Math.floor(Math.random() * phrases.length)];

    if(tentatives === 8){
        phrase = "Bon... tu as assez joue maintenant.";
    }

    if(tentatives === 12){
        phrase = "Tu sais tres bien lequel tu vas finir par choisir.";
    }

    message.textContent = phrase;

}

noBtn.addEventListener("mouseenter", moveButton);

noBtn.addEventListener("click", function(e){
    e.preventDefault();
    moveButton();
});

noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton();
});

yesBtn.addEventListener("click", function(){

    yesBtn.textContent = "Excellent choix";

    setTimeout(function(){
        alert("Succes ! La suite arrive ensuite.");
    }, 800);

});

</script>

</body>
</html>
