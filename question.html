<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    padding:50px;
    background:#f8f6f2;
}

button{
    padding:15px 25px;
    margin:10px;
    cursor:pointer;
}
</style>

</head>
<body>

<h1>Et si on passait une soirée ensemble la semaine prochaine ?</h1>

<button id="yesBtn">Je me laisse tenter</button>

<button id="noBtn">Non merci</button>

<script>

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function() {

    noBtn.style.position = "absolute";

    noBtn.style.left =
        Math.floor(Math.random()*500) + "px";

    noBtn.style.top =
        Math.floor(Math.random()*300) + "px";
});

</script>

</body>
</html>
