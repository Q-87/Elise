<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Une petite question...</title>

<style>

body{
    margin:0;
    font-family:Georgia, serif;
    background:#f8f6f2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
    max-width:650px;
    width:90%;
}

h2{
    color:#222;
    font-weight:normal;
    margin-bottom:30px;
}

.buttons{
    position:relative;
    height:180px;
    margin-top:20px;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
}

#yesBtn{
    background:#1f2937;
    color:white;
}

#noBtn{
    position:absolute;
    left:60%;
    top:70px;
    background:#d1d5db;
}

.message{
    margin-top:20px;
    min-height:30px;
    color:#666;
    font-style:italic;
}

.tip{
    margin-top:20px;
    color:#555;
    font-style:italic;
}

</style>
</head>

<body>

<div class="card">

<h2>
Et si on passait une soirée ensemble la semaine prochaine ?
</h2>

<div class="buttons">

<button id="yesBtn">
Je me laisse tenter
</button>

<button id="noBtn">
Non merci
</button>

</div>

<div class="message" id="message"></div>

<div class="tip">
Par curiosité, essaie de cliquer sur "Non merci"... 😉
</div>

</div>

<script>

const messages = [
"Bien essayé 😏",
"Raté.",
"Toujours pas.",
"Je vois que tu es persévérante.",
"Cette option semble indisponible.",
"Essaie encore.",
"Tu chauffes... ou pas.",
"Je préférais l'autre bouton.",
"Tu croyais vraiment que c'était une option ? 😌",
"Décidément...",
"Quel acharnement.",
"Je t'assure que l'autre bouton fonctionne très bien.",
"Presque !",
"Non, non et toujours non.",
"C'est pourtant écrit « Non merci »...",
"Je commence à admirer ta détermination."
];

const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");

function moveButton(){

    const x = Math.random()*250;
    const y = Math.random()*100;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    const randomMessage =
        messages[Math.floor(Math.random()*messages.length)];

    message.textContent = randomMessage;
}

noBtn.addEventListener('mouseover', moveButton);
noBtn.addEventListener('click', moveButton);

document.getElementById("yesBtn").addEventListener("click", function(){

    this.innerHTML = "Excellent choix 😌";

    setTimeout(() => {
       window.location.href = "dates.html";
    },1000);

});

</script>

</body>
</html>
