<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Une petite question...</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #fdfcf9,
            #f6f2ea
        );

    font-family:
        Georgia,
        serif;

    color:#222;
}

.card{
    width:100%;
    max-width:700px;

    padding:50px 35px;

    background:white;

    border-radius:24px;

    text-align:center;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.08);
}

h1{
    margin:
        0 0 32px;

    font-size:
        clamp(
            1.6rem,
            5vw,
            2rem
        );

    font-weight:normal;
    line-height:1.5;
}

.zone{
    position:relative;

    width:100%;
    height:350px;

    overflow:hidden;

    border:
        1px solid
        #eee7df;

    border-radius:18px;

    background:
        #faf8f5;
}

/* Bouton principal */

#oui{
    position:absolute;
    z-index:20;

    left:50%;
    bottom:24px;

    padding:
        16px 30px;

    transform:
        translateX(-50%);

    border:0;
    border-radius:999px;

    background:#1f2937;
    color:white;

    font-size:16px;

    cursor:pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

#oui:hover{
    transform:
        translateX(-50%)
        scale(1.03);

    box-shadow:
        0 10px 24px
        rgba(31,41,55,.22);
}

#oui.pulse{
    animation:
        pulse 1s infinite;
}

/* Bloc contenant Non merci et sa phrase */

#nonBloc{
    position:absolute;
    z-index:10;

    top:38px;
    left:50%;

    width:240px;

    transform:
        translateX(-50%);

    text-align:center;

    transition:
        left .22s ease,
        top .22s ease,
        opacity .28s ease;
}

#non{
    padding:
        15px 28px;

    border:0;
    border-radius:999px;

    background:#e5e7eb;
    color:#333;

    font-size:16px;

    cursor:pointer;

    transition:
        transform .22s ease,
        opacity .22s ease;
}

#phrase{
    min-height:42px;

    margin-top:9px;

    color:#666;

    font:
        italic
        14px/1.4
        Arial,
        sans-serif;
}

.tip{
    margin:
        18px 0 0;

    color:#666;

    font:
        italic
        14px/1.5
        Arial,
        sans-serif;
}

#finalMessage{
    display:none;

    position:absolute;

    top:42%;
    left:50%;

    width:90%;

    transform:
        translate(
            -50%,
            -50%
        );

    color:#8b5e49;

    font:
        600
        16px/1.5
        Arial,
        sans-serif;
}

@keyframes pulse{

    50%{
        transform:
            translateX(-50%)
            scale(1.05);
    }

}

@media(max-width:600px){

    .card{
        padding:
            34px 20px;
    }

    .zone{
        height:390px;
    }

    #nonBloc{
        width:210px;
    }

    #oui{
        padding:
            15px 24px;

        font-size:15px;
    }

}

</style>

</head>

<body>

<main class="card">

<h1>
Et si on passait une soirée ensemble
la semaine prochaine ?
</h1>

<div
    class="zone"
    id="zone"
>

    <div id="nonBloc">

        <button
            id="non"
            type="button"
        >
            Non merci
        </button>

        <div
            id="phrase"
            aria-live="polite"
        ></div>

    </div>

    <div id="finalMessage">

        Cette option a officiellement disparu.

        <br>

        Quelle malchance... 😌

    </div>

    <button
        id="oui"
        type="button"
    >
        Je me laisse tenter
    </button>

</div>

<p class="tip">

Par curiosité, essaie de cliquer sur
« Non merci »... 😉

</p>

</main>

<script>

/*
Messages affichés dans l'ordre,
avec une progression crescendo.
*/

const messages = [

    "Bien essayé 😏",

    "Raté.",

    "Toujours pas.",

    "Essaie encore.",

    "Presque !",

    "Tu chauffes... ou pas.",

    "Cette option semble indisponible.",

    "Je préférais l'autre bouton.",

    "Décidément, tu es tenace.",

    "Je vois que tu es persévérante.",

    "Quel acharnement.",

    "Je commence à admirer ta détermination.",

    "Je t'assure que l'autre bouton fonctionne très bien.",

    "Tu croyais vraiment que c'était une option ? 😌",

    "Bon... tu as assez joué maintenant.",

    "Tu sais très bien lequel tu vas finir par choisir.",

    "Dernière chance... enfin, façon de parler.",

    "Cette option va bientôt disparaître.",

    "C'était pourtant prévisible.",

    "Fin de la négociation 😌"

];


/*
Récupération des éléments
de la page.
*/

const zone =
    document.getElementById("zone");

const bloc =
    document.getElementById("nonBloc");

const boutonNon =
    document.getElementById("non");

const boutonOui =
    document.getElementById("oui");

const phrase =
    document.getElementById("phrase");

const finalMessage =
    document.getElementById(
        "finalMessage"
    );


let essais = 0;

let disparu = false;


/*
Détermine si deux zones
se chevauchent.
*/

function chevauche(
    rectangleA,
    rectangleB,
    marge
){

    return !(

        rectangleA.right + marge
            < rectangleB.left

        ||

        rectangleA.left - marge
            > rectangleB.right

        ||

        rectangleA.bottom + marge
            < rectangleB.top

        ||

        rectangleA.top - marge
            > rectangleB.bottom

    );

}


/*
Recherche une position qui
ne chevauche pas le bouton Oui.
*/

function trouverPosition(){

    const largeurZone =
        zone.clientWidth;

    const hauteurZone =
        zone.clientHeight;

    const largeurBloc =
        Math.min(
            bloc.offsetWidth,
            largeurZone - 20
        );

    const hauteurBloc =
        bloc.offsetHeight;


    const zoneBoutonOui = {

        left:
            boutonOui.offsetLeft
            - boutonOui.offsetWidth / 2,

        right:
            boutonOui.offsetLeft
            + boutonOui.offsetWidth / 2,

        top:
            boutonOui.offsetTop,

        bottom:
            boutonOui.offsetTop
            + boutonOui.offsetHeight

    };


    for(
        let tentative = 0;
        tentative < 80;
        tentative++
    ){

        const positionX =

            largeurBloc / 2
            + 10
            + Math.random()

            * Math.max(
                0,
                largeurZone
                - largeurBloc
                - 20
            );


        const positionY =

            10
            + Math.random()

            * Math.max(
                0,
                hauteurZone
                - hauteurBloc
                - 20
            );


        const candidat = {

            left:
                positionX
                - largeurBloc / 2,

            right:
                positionX
                + largeurBloc / 2,

            top:
                positionY,

            bottom:
                positionY
                + hauteurBloc

        };


        if(
            !chevauche(
                candidat,
                zoneBoutonOui,
                20
            )
        ){

            return {

                x:positionX,

                y:positionY

            };

        }

    }


    return {

        x:
            largeurZone / 2,

        y:20

    };

}


/*
Déplace et rétrécit
le bouton Non.
*/

function fuite(evenement){

    if(evenement){

        evenement.preventDefault();

        evenement.stopPropagation();

    }


    if(disparu){

        return;

    }


    essais++;


    const indexMessage =

        Math.min(
            essais - 1,
            messages.length - 1
        );


    phrase.textContent =
        messages[indexMessage];


    /*
    Rétrécissement progressif.
    */

    const progression =

        essais
        / messages.length;


    const echelle =

        Math.max(
            0.12,
            1
            - progression * 0.88
        );


    const opacite =

        Math.max(
            0.2,
            1
            - progression * 0.75
        );


    boutonNon.style.transform =

        "scale("
        + echelle
        + ")";


    boutonNon.style.opacity =

        String(opacite);


    /*
    Disparition après le
    dernier message.
    */

    if(
        essais
        >= messages.length
    ){

        disparu = true;

        bloc.style.opacity = "0";


        setTimeout(
            function(){

                bloc.style.display =
                    "none";

                finalMessage.style.display =
                    "block";

                boutonOui.classList.add(
                    "pulse"
                );

            },
            280
        );


        return;

    }


    /*
    Nouvelle position.
    */

    const position =
        trouverPosition();


    bloc.style.left =

        position.x
        + "px";


    bloc.style.top =

        position.y
        + "px";

}


/*
PC : le bouton fuit lorsque
la souris arrive dessus.
*/

boutonNon.addEventListener(

    "mouseenter",

    fuite

);


/*
PC : sécurité si le clic arrive
tout de même à passer.
*/

boutonNon.addEventListener(

    "click",

    fuite

);


/*
Téléphone et tablette :
le bouton fuit lors du toucher.
*/

boutonNon.addEventListener(

    "touchstart",

    fuite,

    {
        passive:false
    }

);


/*
Clic sur le bouton principal.
*/

boutonOui.addEventListener(

    "click",

    function(){

        /*
        Empêche un double clic.
        */

        boutonOui.disabled =
            true;


        boutonOui.classList.remove(
            "pulse"
        );


        boutonOui.textContent =

            "Excellent choix, Elise 😌";


        localStorage.setItem(

            "reponse",

            "oui"

        );


        /*
        Redirection vers dates.html.
        */

        setTimeout(

            function(){

                window.location.href =

                    "dates.html";

            },

            1000

        );

    }

);

</script>

</body>

</html>
