<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Question</title>
</head>

<body>

<h1>Et si on passait une soirée ensemble la semaine prochaine ?</h1>

<button id="yesBtn">Je me laisse tenter</button>
<button id="noBtn">Non merci</button>

<script>

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function(){

    noBtn.style.position = "absolute";
    noBtn.style.left = Math.random()*500 + "px";
    noBtn.style.top = Math.random()*300 + "px";

});

</script>

</body>
</html>
