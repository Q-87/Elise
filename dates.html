<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Choix de la date</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fdfcf9,#f6f2ea);
    font-family:Georgia, serif;
    padding:20px;
}

.card{
    width:100%;
    max-width:700px;
    background:white;
    padding:50px 35px;
    border-radius:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
    text-align:center;
}

.date{
    width:100%;
    margin:8px 0;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#f3f4f6;
    cursor:pointer;
    font-size:16px;
}

.date:hover{
    background:#e5e7eb;
}

.bloque{
    background:#ececec;
    color:#999;
    cursor:not-allowed;
}

#zoneCalendrier{
    display:none;
    margin-top:20px;
}

input[type="date"]{
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
}

</style>

<script>

function choisir(date){

    localStorage.setItem(
        "dateChoisie",
        date
    );

    window.location.href =
        "message.html";
}

function afficherCalendrier(){

    document.getElementById(
        "zoneCalendrier"
    ).style.display="block";
}

function validerAutreDate(){

    const date =
        document.getElementById(
            "autreDate"
        ).value;

    if(!date){

        alert(
            "Sélectionne une date 😊"
        );

        return;
    }

    localStorage.setItem(
        "dateChoisie",
        date
    );

    window.location.href =
        "message.html";
}

</script>

</head>

<body>

<div class="card">

<h2>
Excellent choix, Elise. 😊
</h2>

<p>
Reste maintenant à trouver le bon moment...
</p>

<button class="date bloque" disabled>

🔒 Lundi 12 octobre au soir

<br><br>

(Impossible, il y a L'Amour est dans le Pré 📺❤️)

</button>

<button class="date"
onclick="choisir('Mardi 13 octobre')">
🌙 Mardi 13 octobre au soir
</button>

<button class="date"
onclick="choisir('Mercredi 14 octobre')">
🌙 Mercredi 14 octobre au soir
</button>

<button class="date"
onclick="choisir('Jeudi 15 octobre')">
🌙 Jeudi 15 octobre au soir
</button>

<button class="date"
onclick="choisir('Vendredi 16 octobre')">
🌙 Vendredi 16 octobre au soir
</button>

<button class="date"
onclick="afficherCalendrier()">
✨ Choisir une autre date
</button>

<div id="zoneCalendrier">

<br>

<input
type="date"
id="autreDate"
min="2026-10-20"
max="2026-10-21">

<br><br>

<button class="date"
onclick="validerAutreDate()">
Valider cette date
</button>

</div>

</div>

</body>
</html>
